name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm tsc --noEmit

      - name: Test
        run: pnpm exec vitest run

      - name: Build
        run: pnpm build
        env:
          # Dummy values: the build must not depend on real secrets.
          NEXTAUTH_SECRET: ci-not-a-secret
          NEXTAUTH_URL: http://127.0.0.1:3000
          SPOTIFY_CLIENT_ID: ci-client-id
          SPOTIFY_CLIENT_SECRET: ci-client-secret
          MOCK_LOGIN: "false"
